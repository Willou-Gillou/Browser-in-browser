<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<title>Browser in Browser</title>
<style>
  html, body { margin: 0; padding: 0; background: #000; overflow: hidden; height: 100%; }
  #urlbar {
    position: fixed; top: 0; left: 0; right: 0; z-index: 10;
    display: flex; gap: 4px; padding: 6px; background: #111;
  }
  #urlbar input { flex: 1; padding: 8px; font-size: 18px; }
  #urlbar button { padding: 8px 16px; font-size: 18px; }
  #screen { display: block; width: 100vw; height: 100vh; object-fit: contain; }
</style>
</head>
<body>
  <div id="urlbar">
    <input id="urlInput" type="text" placeholder="URL..." />
    <button id="goBtn">Aller</button>
  </div>
  <img id="screen" alt="stream" />

<script>
  const img = document.getElementById("screen");
  const proto = location.protocol === "https:" ? "wss://" : "ws://";
  let ws;

  function connect() {
    ws = new WebSocket(proto + location.host + "/ws");
    ws.onmessage = (event) => {
      const msg = JSON.parse(event.data);
      if (msg.type === "frame") {
        img.src = "data:image/jpeg;base64," + msg.data;
      }
    };
    ws.onclose = () => {
      setTimeout(connect, 1000);
    };
  }
  connect();

  function send(obj) {
    if (ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify(obj));
  }

  // Le viewport distant est fixe (1280x720). Avec object-fit: contain,
  // l'élément <img> peut avoir des bandes noires (letterboxing) si la
  // fenêtre n'a pas exactement ce ratio : il faut calculer la zone réelle
  // de contenu affiché, pas juste la box de l'élément.
  const REMOTE_W = 1280;
  const REMOTE_H = 720;

  function getContentRect() {
    const rect = img.getBoundingClientRect();
    const containerRatio = rect.width / rect.height;
    const contentRatio = REMOTE_W / REMOTE_H;
    let renderW, renderH, offsetX, offsetY;
    if (containerRatio > contentRatio) {
      renderH = rect.height;
      renderW = renderH * contentRatio;
      offsetX = (rect.width - renderW) / 2;
      offsetY = 0;
    } else {
      renderW = rect.width;
      renderH = renderW / contentRatio;
      offsetX = 0;
      offsetY = (rect.height - renderH) / 2;
    }
    return { left: rect.left + offsetX, top: rect.top + offsetY, width: renderW, height: renderH };
  }

  function toPageCoords(clientX, clientY) {
    const cr = getContentRect();
    const x = ((clientX - cr.left) / cr.width) * REMOTE_W;
    const y = ((clientY - cr.top) / cr.height) * REMOTE_H;
    return { x, y };
  }

  img.addEventListener("mousemove", (e) => {
    const { x, y } = toPageCoords(e.clientX, e.clientY);
    send({ type: "mousemove", x, y });
  });
  img.addEventListener("mousedown", (e) => {
    const { x, y } = toPageCoords(e.clientX, e.clientY);
    send({ type: "mousedown", x, y });
  });
  img.addEventListener("mouseup", () => send({ type: "mouseup" }));
  img.addEventListener(
    "wheel",
    (e) => {
      send({ type: "wheel", dx: e.deltaX, dy: e.deltaY });
      e.preventDefault();
    },
    { passive: false }
  );

  document.addEventListener("keydown", (e) => send({ type: "keydown", key: e.key }));
  document.addEventListener("keyup", (e) => send({ type: "keyup", key: e.key }));

  document.getElementById("goBtn").addEventListener("click", () => {
    const val = document.getElementById("urlInput").value.trim();
    if (!val) return;
    const url = val.startsWith("http") ? val : "https://" + val;
    send({ type: "goto", url });
  });
</script>
</body>
</html>
